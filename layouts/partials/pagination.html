{{ if or (.Paginator.HasPrev) (.Paginator.HasNext) }}
<nav role="pagination" class="pagination container">
  {{ if .Paginator.HasNext }}
  <a class="older" href="{{.Paginator.Next.URL}}">{{ partial "icon.html" (dict "name" "chevrons-left") }} Older</a>
  {{ end }}

  {{ if .Paginator.HasPrev }}
  <a class="newer" href="{{.Paginator.Prev.URL}}">Newer {{ partial "icon.html" (dict "name" "chevrons-right") }}</a>
  {{ end }}
</nav>
{{ end }}
